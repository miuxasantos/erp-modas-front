<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 to-slate-800 px-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden">

        <div class="bg-gradient-to-r from-violet-600 to-violet-500 px-8 py-10 text-white text-center">
            <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i class="pi pi-shopping-bag text-3xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">ERP Modas</h1>
            <p class="text-violet-200 text-sm mt-1">Faça login para continuar</p>
        </div>

        <div class="px-8 py-8">
            <form [formGroup]="form" (ngSubmit)="login()" class="flex flex-col gap-5">

                <div class="flex flex-col gap-1">
                    <label for="email" class="text-sm font-medium text-slate-700">E-mail</label>
                    <div class="p-inputgroup">
                        <span class="p-inputgroup-addon">
                            <i class="pi pi-envelope text-slate-400"></i>
                        </span>
                        <input
                            pInputText
                            id="email"
                            type="email"
                            formControlName="email"
                            placeholder="seu@email.com"
                            autocomplete="email"
                            [class.ng-invalid]="emailInvalido"
                            [class.ng-dirty]="emailInvalido"
                            class="w-full"
                        />
                    </div>
                    @if (emailInvalido) {
                        <small class="text-red-500 text-xs flex items-center gap-1">
                            <i class="pi pi-exclamation-circle"></i>
                            E-mail inválido
                        </small>
                    }
                </div>

                <div class="flex flex-col gap-1">
                    <label for="senha" class="text-sm font-medium text-slate-700">Senha</label>
                    <p-password
                        formControlName="senha"
                        inputId="senha"
                        placeholder="••••••••"
                        [feedback]="false"
                        [toggleMask]="true"
                        styleClass="w-full"
                        inputStyleClass="w-full"
                        autocomplete="current-password"
                        [class.ng-invalid]="senhaInvalida"
                        [class.ng-dirty]="senhaInvalida"
                    />
                    @if (senhaInvalida) {
                        <small class="text-red-500 text-xs flex items-center gap-1">
                            <i class="pi pi-exclamation-circle"></i>
                            Senha deve ter no mínimo 6 caracteres
                        </small>
                    }
                </div>

                <p-button
                    type="submit"
                    label="Entrar"
                    icon="pi pi-sign-in"
                    iconPos="right"
                    styleClass="w-full justify-center"
                    [loading]="carregando()"
                />

            </form>
        </div>
    </div>

</div>
