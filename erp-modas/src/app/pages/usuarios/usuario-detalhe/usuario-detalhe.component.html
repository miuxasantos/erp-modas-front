<div class="p-4">

    <app-page-header
        titulo="Detalhe do Usuario"
        [breadcrumbs]="breadcrumbs"
        botaoLabel="Voltar"
        botaoIcone="pi pi-arrow-left"
        (botaoClick)="voltar()"
    />

    @if (usuario) {
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

            <p-card header="Dados">
                <div class="flex flex-col gap-3">
                    <div>
                        <p class="text-xs text-gray-400">Nome</p>
                        <p class="text-sm font-medium">{{ usuario.nome }}</p>
                    </div>
                    <div>
                        <p class="text-xs text-gray-400">Email</p>
                        <p class="text-sm font-medium">{{ usuario.email }}</p>
                    </div>
                    <div>
                        <p class="text-xs text-gray-400">Cargo</p>
                        <p class="text-sm font-medium">{{ usuario.cargo }}</p>
                    </div>
                    <div>
                        <p class="text-xs text-gray-400">Ativo</p>
                        <p class="text-sm font-medium">{{ usuario.status == true ? 'Ativo' : 'Falso' }}</p>
                    </div>
                    <div>
                        <p class="text-xs text-gray-400">Último Acesso</p>
                        <p class="text-sm font-medium">{{ usuario.ultimoAcesso }}</p>
                    </div>
                </div>
            </p-card>
        </div>
    }

</div>
