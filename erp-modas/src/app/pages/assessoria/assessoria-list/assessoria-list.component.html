<div class="p-4">
    <app-page-header
        titulo="Assessorias"
        [breadcrumbs]="breadcrumbs"
        botaoLabel="Nova Assessoria"
        botaoIcone="pi pi-plus"
        (botaoClick)="abrirNovo()"
    />

    <p-table
        [value]="assessorias"
        [paginator]="true"
        [rows]="10"
        [rowsPerPageOptions]="[10, 25, 50]"
        [globalFilterFields]="['nome']"
        stripedRows
    >
        <ng-template #header>
            <tr>
                <th pSortableColumn="nome">Nome <p-sortIcon field="nome"/></th>
                <th>Contato</th>
                <th style="width: 120px">Ações</th>
            </tr>
        </ng-template>

        <ng-template #body let-assessoria>
            <tr>
                <td>{{ assessoria.nome }}</td>
                <td>{{ assessoria.contato | mascara:'telefone' }}</td>
                <td>
                    <div class="flex gap-1">
                        <p-button
                            icon="pi pi-eye"
                            [text]="true"
                            [rounded]="true"
                            severity="info"
                            pTooltip="Ver detalhe"
                            (onClick)="verDetalhe(assessoria.id)"
                        />
                        <p-button
                            *temPermissao="'isProprietario'"
                            icon="pi pi-pencil"
                            [text]="true"
                            [rounded]="true"
                            severity="secondary"
                            pTooltip="Editar"
                            (onClick)="abrirEdicao(assessoria)"
                        />
                        <p-button
                            *temPermissao="'isProprietario'"
                            icon="pi pi-trash"
                            [text]="true"
                            [rounded]="true"
                            severity="danger"
                            pTooltip="Excluir"
                            (onClick)="confirmarExclusao(assessoria.id)"
                        />
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template #emptymessage>
            <tr>
                <td colspan="5" class="text-center py-8 text-gray-400">
                Nenhuma assessoria encontrada.
                </td>
            </tr>
        </ng-template>

    </p-table>

    <p-dialog
        [header]="assessoriaEditando ? 'Editar Assessoria' : 'Nova Assessoria'"
        [visible]="dialogVisivel()"
        (visibleChange)="fecharDialog()"
        [modal]="true"
        [style]="{ width: '500px' }"
        [draggable]="false"
    >

        <form [formGroup]="form" class="flex flex-col gap-4 pt-2">

            <div class="flex flex-col gap-1">
                <label class="text-sm text-gray-600">Nome *</label>
                <input pInputText formControlName="nome" placeholder="Nome completo" />
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-sm text-gray-600">Contato</label>
                <p-inputmask formControlName="contato" placeholder="(00) 00000-0000" mask="(99) 99999-9999" [unmask]="true"></p-inputmask>
            </div>
        </form>

        <ng-template #footer>
            <p-button
                label="Cancelar"
                [text]="true"
                severity="secondary"
                (onClick)="fecharDialog()"
            />
            <p-button
                [label]="assessoriaEditando ? 'Salvar alterações' : 'Criar assessoria'"
                icon="pi pi-check"
                [loading]="salvando()"
                [disabled]="form.invalid"
                (onClick)="salvar()"
            />
        </ng-template>

    </p-dialog>

</div>
