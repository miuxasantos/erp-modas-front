<div class="p-4">
    <app-page-header
        titulo="Marcas"
        [breadcrumbs]="breadcrumbs"
        botaoLabel="Nova Marca"
        botaoIcone="pi pi-plus"
        (botaoClick)="abrirNovo()"
    />

    <p-table
        [value]="marcas"
        [paginator]="true"
        [rows]="10"
        [rowsPerPageOptions]="[10, 25, 50]"
        [globalFilterFields]="['nome']"
        stripedRows
    >
        <ng-template #header>
            <tr>
                <th pSortableColumn="nome">Nome <p-sortIcon field="nome"/></th>
                <th>Observações</th>
                <th style="width: 120px">Ações</th>
            </tr>
        </ng-template>

        <ng-template #body let-marca>
            <tr>
                <td>{{ marca.nome}}</td>
                <td>{{ marca.observacoes }}</td>
                <td>
                    <div class="flex gap-1">
                        <p-button
                            icon="pi pi-eye"
                            [text]="true"
                            [rounded]="true"
                            severity="info"
                            pTooltip="Ver detalhe"
                            (onClick)="verDetalhe(marca.id)"
                        />
                        <p-button
                            *temPermissao="'isProprietario'"
                            icon="pi pi-pencil"
                            [text]="true"
                            [rounded]="true"
                            severity="secondary"
                            pTooltip="Editar"
                            (onClick)="abrirEdicao(marca)"
                        />
                        <p-button
                            *temPermissao="'isProprietario'"
                            icon="pi pi-trash"
                            [text]="true"
                            [rounded]="true"
                            severity="danger"
                            pTooltip="Excluir"
                            (onClick)="confirmarExclusao(marca.id)"
                        />
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template #empty>
            <tr>
                <td colspan="5" class="text-center py-8 text-gray-400">
                Nenhuma marca encontrada
                </td>
            </tr>
        </ng-template>

    </p-table>

    <p-dialog
        [header]="marcaEditando ? 'Editar Marca' : 'Nova Marca'"
        [visible]="dialogVisivel()"
        (visibleChange)="fecharDialog()"
        [modal]="true"
        [style]="{ width: '500px' }"
        [draggable]="false"
    >

    <form [formGroup]="form" class="flex flex-col gap-4 pt-2">

        <div class="flex flex-col gap-1">
            <label class="text-sm text-gray-600">Nome *</label>
            <input pInputText formControlName="nome" placeholder="Nome da marca" />
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-sm text-gray-600">Observações</label>
            <input pInputText formControlName="observacoes" placeholder="Observações sobre a marca" />
        </div>
    </form>

    <ng-template #footer>
        <p-button
            label="Cancelar"
            [text]="true"
            severity="secondary"
            (onClick)="fecharDialog()"
        />
        <p-button
            [label]="marcaEditando ? 'Salvar alterações' : 'Criar marca'"
            icon="pi pi-check"
            [loading]="salvando()"
            [disabled]="form.invalid"
            (onClick)="salvar()"
        />
    </ng-template>

  </p-dialog>

</div>
