<div clas="p-4">
    <app-page-header
        titulo="Cores"
        [breadcrumbs]="breadcrumbs"
        botaoLabel="Nova Cor"
        botaoIcone="pi pi-plus"
        (botaoClick)="abrirNovo()"
    />

    <p-table
        [value]="cores"
        [paginator]="true"
        [rows]="10"
        [rowsPerPageOptions]="[10, 25, 50]"
        [globalFilterFields]="['nome', 'codigoHex']"
        stripedRows
    >
        <ng-template #header>
            <tr>
                <th pSortableColumn="nome">Nome <p-sortIcon field="nome"/></th>
                <th>Código Hexadecimal</th>
                <th style="width: 120px">Ações</th>
            </tr>
        </ng-template>

        <ng-template #body let-cor>
            <tr>
                <td>{{ cor.nome}}</td>
                <td>{{ cor.codigoHex }}</td>
                <td>
                    <div class="flex gap-1">
                        <p-button
                            icon="pi pi-eye"
                            [text]="true"
                            [rounded]="true"
                            severity="info"
                            pTooltio="Ver detalhe"
                            (onClick)="verDetalhe(cor.id)"
                        />
                        <p-button
                            icon="pi pi-pencil"
                            [text]="true"
                            [rounded]="true"
                            severity="secondary"
                            pTooltip="Editar"
                            (onClick)="abrirEdicao(cor)"
                        />
                        <p-button
                            icon="pi pi-trash"
                            [text]="true"
                            [rounded]="true"
                            severity="danger"
                            pTooltip="Excluir"
                            (onClick)="confirmarExclusao(cor.id)"
                        />
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template #empty>
            <tr>
                <td colspan="5" class="text-center py-8 text-gray-400">
                Nenhuma cor encontrada
                </td>
            </tr>
        </ng-template>

    </p-table>

    <p-dialog
        [header]="corEditando ? 'Editar Cor' : 'Nova Cor'"
        [visible]="dialogVisivel()"
        (visibleChange)="fecharDialog()"
        [modal]="true"
        [style]="{ width: '500px' }"
        [draggable]="false"
    >

    <form [formGroup]="form" class="flex flex-col gap-4 pt-2">

        <div class="flex flex-col gap-1">
            <label class="text-sm text-gray-600">Nome *</label>
            <input pInputText formControlName="nome" placeholder="Nome da cor" />
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-sm text-gray-600">Código Hexadecimal *</label>
            <input pInputText formControlName="codigoHex" placeholder="Código exemplo (#00000)" />
        </div>
    </form>

    <ng-template #footer>
        <p-button
            label="Cancelar"
            [text]="true"
            severity="secondary"
            (onClick)="fecharDialog()"
        />
        <p-button
            [label]="corEditando ? 'Salvar alterações' : 'Criar cor'"
            icon="pi pi-check"
            [loading]="salvando()"
            [disabled]="form.invalid"
            (onClick)="salvar()"
        />
    </ng-template>

  </p-dialog>

</div>
