<p-confirmDialog>
    <ng-template #message let-message>
        <div class="flex flex-col items-center gap-4 p-4">
          <i class="pi pi-exclamation-triangle text-4xl text-yellow-500"></i>
          <p class="text-center text-gray-700">{{ message.message }}</p>
        </div>
    </ng-template>
</p-confirmDialog>
