<!-- shared/components/page-header/page-header.component.html -->
<div class="flex flex-wrap items-center justify-between gap-3 mb-6">

  <!-- Lado esquerdo — título + breadcrumb -->
  <div class="flex flex-col gap-1 min-w-0">

    <h1 class="text-2xl font-bold text-gray-800">
      {{ titulo() }}
    </h1>

    <div  class="w-fit overflow-hidden rounded-lg
             [&_.p-breadcrumb]:!rounded-lg
             [&_.p-breadcrumb]:!border-none
             [&_.p-breadcrumb]:!bg-white">
             
    <p-breadcrumb
      [model]="breadcrumbs()"
      class="!rounded-lg !border-none !bg-white"
    />
  </div>
  </div>

  <!-- Lado direito — botão de ação -->
  @if (botaoVisivel() && botaoLabel()) {
    <p-button
      [label]="botaoLabel()"
      [icon]="botaoIcone()"
      (onClick)="botaoClick.emit()"
    />
  }

</div>
