<aside
  class="fixed top-0 left-0 h-full w-72 bg-white border-r border-gray-200 z-50 flex flex-col transition-transform duration-300"
  [ngClass]="visivel() ? 'translate-x-0' : '-translate-x-full'"
>

  <div class="h-16 flex items-center justify-between px-4 border-b border-gray-200">
    <span class="font-bold text-xl text-gray-800">ERP Modas</span>
    <p-button
      icon="pi pi-times"
      [text]="true"
      [rounded]="true"
      severity="secondary"
      (onClick)="fechar.emit()"
    />
  </div>

  <nav class="flex-1 overflow-y-auto py-4 px-3">
    @for (group of navGroups; track group.label) {

      <span class="text-xs font-semibold text-gray-400 uppercase px-3 mb-1 block">
        {{ group.label }}
      </span>

      @for (item of group.items; track item.route) {
        
        <a 
            [routerLink]="item.route"
            routerLinkActive="bg-primary-50 text-primary-600 font-medium"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 transition-colors mb-0.5"
            (click)="fechar.emit()"
        >
          <i [class]="item.icon + ' text-lg'"></i>
          <span class="text-sm">{{ item.label }}</span>
        </a>
      }

      <p-divider />
    }
  </nav>

</aside>
