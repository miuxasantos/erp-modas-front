<div class="min-h-full flex flex-col bg-gray-50">
    @if (sidebarVisivel()) {
        <div 
            class="fixed inset-0 bg-black/40 z-40"
            (click)="fecharSidebar()"
        ></div>
    }

    <app-sidebar
        [visivel]="sidebarVisivel()"
        (fechar)="fecharSidebar()"
    />

    <div class="flex flex-col flex-1 min-h-screen">
        <app-topbar (menuClick)="abrirSidebar()"/>
        <main class="p-6">
            <router-outlet />
        </main>

    </div>
</div>
