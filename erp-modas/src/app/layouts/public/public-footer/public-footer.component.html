<!-- layout/public-layout/footer/footer-public.component.html -->
<footer class="bg-pink-900 text-pink-200 max-h-100">

  <div class="px-4 md:px-8 py-4 grid grid-cols-1 md:grid-cols-4 gap-8">

    <div class="md:col-span-2">
      <p class="text-lg font-semibold tracking-widest text-pink-100 mb-3">
        Shirleys Modas
      </p>
      <p class="text-sm text-pink-300 leading-relaxed">
        Rua Manoel Ribas, 779 - Centro, Paranavaí
        <br />
        CEP: 87701-000
        <br />
        Próximo ao Shopping Premiere
      </p>
    </div>

    <div>
      <p class="text-sm font-medium text-pink-100 mb-3">Fale conosco</p>
      <div class="flex flex-col gap-2">
        <a
          [href]="loja.instagram"
          target="_blank"
          class="text-sm text-pink-300 hover:text-pink-100 transition-colors flex items-center gap-2"
        >
          <i class="pi pi-instagram"></i>
          Instagram
        </a>
        
        <a
          [href]="whatsapp"
          target="_blank"
          class="text-sm text-pink-300 hover:text-pink-100 transition-colors flex items-center gap-2"
        >
          <i class="pi pi-whatsapp"></i>
          WhatsApp
        </a>

        <a
          [href]="'mailto:' + loja.email"
          class="text-sm text-pink-300 hover:text-pink-100 transition-colors flex items-center gap-2"
        >
          <i class="pi pi-envelope"></i>
          E-mail
        </a>
      </div>
    </div>

  </div>

  <div class="px-4 md:px-8 py-2 flex flex-wrap items-center justify-between gap-2">
    <p class="text-xs text-pink-400">
      © {{ ano }} Shirleys Modas. Todos os direitos reservados.
    </p>
    <a
      routerLink="/auth/login"
      class="text-xs text-pink-500 hover:text-pink-300 transition-colors"
    >
      Acesso administrativo
    </a>
  </div>

</footer>
