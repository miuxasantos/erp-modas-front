<footer class="bg-black text-white max-h-40">

  <div class="px-4 md:px-8 py-1 grid grid-cols-1 md:grid-cols-4 gap-8">

    <div class="md:col-span-2">
      <p class="text-base font-semibold tracking-widest text-white mb-3">
        Shirleys Modas
      </p>
      <p class="text-xs text-white leading-relaxed">
        Rua Manoel Ribas, 779 - Centro, Paranavaí
        <br />
        CEP: 87701-000
        <br />
        Próximo ao Shopping Premiere
      </p>
    </div>

    <div>
      <p class="text-xs font-medium text-white mb-3">Fale conosco</p>
      <div class="flex flex-col gap-2">
        <a
          [href]="loja.instagram"
          target="_blank"
          class="text-xs text-white hover:text-gray-600 transition-colors flex items-center gap-2"
        >
          <i class="pi pi-instagram"></i>
          Instagram
        </a>
        
        <a
          [href]="whatsapp"
          target="_blank"
          class="text-xs text-white hover:text-gray-600 transition-colors flex items-center gap-2"
        >
          <i class="pi pi-whatsapp"></i>
          WhatsApp
        </a>

        <a
          [href]="'mailto:' + loja.email"
          class="text-xs text-white hover:text-gray-600 transition-colors flex items-center gap-2"
        >
          <i class="pi pi-envelope"></i>
          E-mail
        </a>
      </div>
    </div>

  </div>

  <div class="px-4 md:px-8 py-2 flex flex-wrap items-center justify-between gap-2">
    <p class="text-xs text-white">
      © {{ ano }} Shirleys Modas. Todos os direitos reservados.
    </p>
    <a
      routerLink="/auth/login"
      class="text-xs text-gray-800 hover:text-gray-700 transition-colors"
    >
      Acesso administrativo
    </a>
  </div>

</footer>
