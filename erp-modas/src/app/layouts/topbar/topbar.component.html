<header class="h-16 bg-white border-b border-gray-200 flex items-center px-4 gap-4 sticky top-0 z-30">
  <p-button
    icon="pi pi-bars"
    [text]="true"
    [rounded]="true"
    severity="secondary"
    (onClick)="menuClick.emit()"
  />

  <span class="font-bold text-xl text-gray-800 flex-1">
    ERP Modas
  </span>

  <div class="flex items-center gap-2">
    <span
      class="w-2 h-2 rounded-full"
      [class]="caixaAberto() ? 'bg-green-500' : 'bg-red-500'"
    ></span>
    <span class="text-sm text-gray-600">
      {{ caixaAberto() ? 'Caixa Aberto' : 'Caixa Fechado' }}
    </span>
  </div>

  <p-avatar
    [label]="usuario()?.primeiroNome?.[0]"
    shape="circle"
    class="cursor-pointer"
    (click)="menu.toggle($event)"
  />

  <p-menu #menu [model]="menuUsuario" [popup]="true" />

</header>
